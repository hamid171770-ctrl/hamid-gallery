<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order | Hamid Gallery</title>
</head>

<body style="margin:0;background:#f2f2f2;font-family:Arial,sans-serif;">

<div style="background:#111;color:white;padding:25px;text-align:center;">
    <h1 style="margin:0;">হামিদ <span style="color:#d22;">গ্যালারি</span></h1>
</div>

<div style="max-width:600px;margin:30px auto;background:white;padding:25px;border-radius:15px;">

    <h2>Customer Information</h2>

    <p>আপনার তথ্য দিয়ে Order সম্পন্ন করুন</p>

    <div style="background:#fff1f2;padding:20px;border-radius:10px;margin:20px 0;">
        <h2 id="bikeName">Sport Rider 150</h2>
        <h2 id="bikePrice">৳250,000</h2>
    </div>

    <form id="orderForm">

        <label>আপনার পূর্ণ নাম *</label>
        <br><br>

        <input
            id="name"
            type="text"
            placeholder="যেমন: Md. Hamid"
            required
            style="width:100%;padding:15px;box-sizing:border-box;"
        >

        <br><br>

        <label>মোবাইল নম্বর *</label>
        <br><br>

        <input
            id="phone"
            type="tel"
            placeholder="01XXXXXXXXX"
            required
            style="width:100%;padding:15px;box-sizing:border-box;"
        >

        <br><br>

        <label>Email</label>
        <br><br>

        <input
            id="email"
            type="email"
            placeholder="example@gmail.com"
            style="width:100%;padding:15px;box-sizing:border-box;"
        >

        <br><br>

        <label>আপনার ঠিকানা *</label>
        <br><br>

        <textarea
            id="address"
            placeholder="আপনার সম্পূর্ণ ঠিকানা লিখুন"
            required
            style="width:100%;height:100px;padding:15px;box-sizing:border-box;"
        ></textarea>

        <br><br>

        <button
            type="submit"
            style="width:100%;padding:16px;background:#b51f32;color:white;border:0;border-radius:10px;font-size:18px;"
        >
            Continue to Payment →
        </button>

    </form>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const bike = params.get("bike") || "Sport Rider 150";
const price = Number(params.get("price")) || 250000;

document.getElementById("bikeName").innerText = bike;

document.getElementById("bikePrice").innerText =
    "৳" + price.toLocaleString("en-BD");

document.getElementById("orderForm").addEventListener("submit", function(e){

    e.preventDefault();

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const email = document.getElementById("email").value;
    const address = document.getElementById("address").value;

    const nextPage =
        "payment.html" +
        "?bike=" + encodeURIComponent(bike) +
        "&price=" + price +
        "&name=" + encodeURIComponent(name) +
        "&phone=" + encodeURIComponent(phone) +
        "&email=" + encodeURIComponent(email) +
        "&address=" + encodeURIComponent(address);

    window.location.href = nextPage;

});

</script>

</body>
</html>
